<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="100%" height="100%">
  <defs>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1D2327" />
      <stop offset="100%" stop-color="#14181B" />
    </linearGradient>

    <style>
      .step-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #F4F1EA; }
      .step-sub { font-family: "JetBrains Mono", Consolas, monospace; font-size: 10px; fill: #8F8B81; }
      .step-accent { font-family: "JetBrains Mono", Consolas, monospace; font-size: 9px; font-weight: 600; }

      @keyframes pulse-flow {
        0% { stroke-dashoffset: 80; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes beacon {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.15); }
      }
      .flow-path {
        stroke: #6F8F7B;
        stroke-width: 2.5;
        stroke-dasharray: 8 6;
        animation: pulse-flow 2s linear infinite;
      }
      .attack-path {
        stroke: #A8403A;
        stroke-width: 2.5;
        stroke-dasharray: 6 4;
        animation: pulse-flow 1.5s linear infinite;
      }
    </style>
  </defs>

  <rect width="1000" height="280" rx="12" fill="#0E1214" stroke="#2D3339" stroke-width="1.5" />

  <!-- Flow Lines Connecting Steps -->
  <path d="M 180 140 L 230 140" class="attack-path" />
  <path d="M 380 140 L 430 140" class="flow-path" />
  <path d="M 580 140 L 630 140" class="flow-path" />
  <path d="M 780 140 L 830 140" class="flow-path" />

  <!-- Step 1: SCADA Ingestion -->
  <g transform="translate(30, 70)">
    <rect width="150" height="140" rx="8" fill="url(#card-grad)" stroke="#385840" stroke-width="1.5" />
    <circle cx="25" cy="30" r="12" fill="#24513B" />
    <text x="25" y="34" text-anchor="middle" font-size="11" fill="#6F8F7B" font-family="monospace">01</text>
    <text x="46" y="34" class="step-title">SCADA Telemetry</text>
    <text x="18" y="65" class="step-sub">22 Pressure / Flow</text>
    <text x="18" y="80" class="step-sub">4 Municipal PLCs</text>
    <rect x="18" y="100" width="114" height="20" rx="4" fill="#14181B" stroke="#24513B" />
    <text x="75" y="113" text-anchor="middle" class="step-accent" fill="#6F8F7B">● Continuous Stream</text>
  </g>

  <!-- Step 2: Cyber Attack Detection -->
  <g transform="translate(230, 70)">
    <rect width="150" height="140" rx="8" fill="url(#card-grad)" stroke="#A8403A" stroke-width="1.5" />
    <circle cx="25" cy="30" r="12" fill="#4A1C1A" />
    <text x="25" y="34" text-anchor="middle" font-size="11" fill="#D97A73" font-family="monospace">02</text>
    <text x="46" y="34" class="step-title">Attack Isolation</text>
    <text x="18" y="65" class="step-sub">Diurnal Residuals</text>
    <text x="18" y="80" class="step-sub">Trust Score T_i → 0.0</text>
    <rect x="18" y="100" width="114" height="20" rx="4" fill="#2A1414" stroke="#A8403A" />
    <text x="75" y="113" text-anchor="middle" class="step-accent" fill="#D97A73">⚠ Quarantine P_J7</text>
  </g>

  <!-- Step 3: Bayesian Reconstruction -->
  <g transform="translate(430, 70)">
    <rect width="150" height="140" rx="8" fill="url(#card-grad)" stroke="#4F7A5A" stroke-width="1.5" />
    <circle cx="25" cy="30" r="12" fill="#24513B" />
    <text x="25" y="34" text-anchor="middle" font-size="11" fill="#6F8F7B" font-family="monospace">03</text>
    <text x="46" y="34" class="step-title">State Reconstruct</text>
    <text x="18" y="65" class="step-sub">Hydraulic Mass/Energy</text>
    <text x="18" y="80" class="step-sub">Hazen-Williams WLS</text>
    <rect x="18" y="100" width="114" height="20" rx="4" fill="#14181B" stroke="#4F7A5A" />
    <text x="75" y="113" text-anchor="middle" class="step-accent" fill="#6F8F7B">⚡ 97.8% RMSE Drop</text>
  </g>

  <!-- Step 4: Twin Pre-Simulation -->
  <g transform="translate(630, 70)">
    <rect width="150" height="140" rx="8" fill="url(#card-grad)" stroke="#C79A3B" stroke-width="1.5" />
    <circle cx="25" cy="30" r="12" fill="#423419" />
    <text x="25" y="34" text-anchor="middle" font-size="11" fill="#E0BA6A" font-family="monospace">04</text>
    <text x="46" y="34" class="step-title">Twin Verification</text>
    <text x="18" y="65" class="step-sub">EPANET Simulation</text>
    <text x="18" y="80" class="step-sub">Constraint Check (P≥15m)</text>
    <rect x="18" y="100" width="114" height="20" rx="4" fill="#1C180F" stroke="#C79A3B" />
    <text x="75" y="113" text-anchor="middle" class="step-accent" fill="#E0BA6A">🛡 100% Gated Safe</text>
  </g>

  <!-- Step 5: Human Approval (HITL) -->
  <g transform="translate(830, 70)">
    <rect width="140" height="140" rx="8" fill="url(#card-grad)" stroke="#6F8F7B" stroke-width="1.8" />
    <circle cx="25" cy="30" r="12" fill="#24513B" />
    <text x="25" y="34" text-anchor="middle" font-size="11" fill="#6F8F7B" font-family="monospace">05</text>
    <text x="46" y="34" class="step-title">Operator Action</text>
    <text x="18" y="65" class="step-sub">Evidence Sheet</text>
    <text x="18" y="80" class="step-sub">SHA-256 Audit Chain</text>
    <rect x="18" y="100" width="104" height="20" rx="4" fill="#14181B" stroke="#6F8F7B" />
    <text x="70" y="113" text-anchor="middle" class="step-accent" fill="#6F8F7B">✓ Human In The Loop</text>
  </g>

  <!-- Top Banner Title -->
  <text x="30" y="38" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="bold" fill="#F4F1EA" letter-spacing="1">PROJECT LASTLINE INCIDENT WORKFLOW</text>
  <text x="970" y="38" text-anchor="end" font-family="monospace" font-size="10" fill="#6F8F7B">FAIL-OPERATIONAL CONTINUITY</text>
</svg>

