<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Dark Basalt Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14181B" />
      <stop offset="50%" stop-color="#1D2327" />
      <stop offset="100%" stop-color="#0E1214" />
    </linearGradient>

    <!-- Hydraulic Water Flow Gradients -->
    <linearGradient id="water-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#24513B" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#4F7A5A" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#6F8F7B" stop-opacity="0.8" />
    </linearGradient>

    <!-- Telemetry Pulse Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; font-weight: 900; fill: #F4F1EA; font-size: 52px; letter-spacing: 4px; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 500; fill: #A5A196; font-size: 19px; letter-spacing: 0.5px; }
      .tagline { font-family: "JetBrains Mono", Consolas, monospace; font-weight: 600; fill: #6F8F7B; font-size: 14px; letter-spacing: 1.5px; }
      .mono-telemetry { font-family: "JetBrains Mono", Consolas, monospace; font-size: 11px; fill: #8F8B81; }

      /* Wave Animations */
      @keyframes wave-flow-1 {
        0% { transform: translateX(0); }
        50% { transform: translateX(-25%); }
        100% { transform: translateX(0); }
      }
      @keyframes wave-flow-2 {
        0% { transform: translateX(-25%); }
        50% { transform: translateX(0); }
        100% { transform: translateX(-25%); }
      }
      @keyframes signal-scan {
        0% { stroke-dashoffset: 600; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes pulse-dot {
        0%, 100% { r: 4px; opacity: 0.4; }
        50% { r: 7px; opacity: 1; }
      }
      @keyframes radar-sweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      .wave-1 { animation: wave-flow-1 14s ease-in-out infinite; }
      .wave-2 { animation: wave-flow-2 18s ease-in-out infinite; }
      .signal-line { stroke-dasharray: 20 10; animation: signal-scan 8s linear infinite; }
      .beacon-1 { animation: pulse-dot 2.5s ease-in-out infinite; }
      .beacon-2 { animation: pulse-dot 3.2s ease-in-out infinite 0.8s; }
      .beacon-alert { animation: pulse-dot 1.4s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" rx="16" fill="url(#bg-grad)" />

  <!-- Grid Blueprint Pattern -->
  <g opacity="0.08" stroke="#F4F1EA" stroke-width="1">
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
    <line x1="150" y1="0" x2="150" y2="420" />
    <line x1="300" y1="0" x2="300" y2="420" />
    <line x1="450" y1="0" x2="450" y2="420" />
    <line x1="600" y1="0" x2="600" y2="420" />
    <line x1="750" y1="0" x2="750" y2="420" />
    <line x1="900" y1="0" x2="900" y2="420" />
    <line x1="1050" y1="0" x2="1050" y2="420" />
  </g>

  <!-- Animated Fluid Waves at Bottom -->
  <g opacity="0.35">
    <path class="wave-2" fill="url(#water-grad)" d="M -300 370 Q 0 340 300 370 T 900 370 T 1500 370 L 1500 420 L -300 420 Z" />
    <path class="wave-1" fill="#4F7A5A" opacity="0.45" d="M -300 385 Q 150 365 450 385 T 1050 385 T 1650 385 L 1650 420 L -300 420 Z" />
  </g>

  <!-- Pipeline SCADA Topology Graphic (Right Side) -->
  <g transform="translate(730, 60)">
    <!-- Tank 1 (Highlands) -->
    <rect x="230" y="30" width="70" height="90" rx="8" fill="#1D2327" stroke="#6F8F7B" stroke-width="2.5" />
    <path d="M 235 95 L 295 95" stroke="#4F7A5A" stroke-width="6" stroke-linecap="round" />
    <text x="265" y="65" text-anchor="middle" class="mono-telemetry" fill="#F4F1EA" font-weight="bold">TANK T1</text>
    <text x="265" y="80" text-anchor="middle" class="mono-telemetry" fill="#6F8F7B">5.0m</text>

    <!-- Junction J7 (Hospital - Protected) -->
    <circle cx="160" cy="180" r="18" fill="#1D2327" stroke="#C79A3B" stroke-width="3" filter="url(#glow)" />
    <text x="160" y="184" text-anchor="middle" class="mono-telemetry" fill="#C79A3B" font-weight="bold">J7</text>
    <text x="160" y="215" text-anchor="middle" class="mono-telemetry" fill="#C79A3B">🏥 Hospital (22.3m)</text>

    <!-- Clearwell Reservoir R1 -->
    <rect x="20" y="150" width="60" height="60" rx="6" fill="#24513B" stroke="#6F8F7B" stroke-width="2" />
    <text x="50" y="185" text-anchor="middle" class="mono-telemetry" fill="#FFFFFF" font-weight="bold">R1</text>

    <!-- Main Booster Pump P1 -->
    <circle cx="90" cy="180" r="12" fill="#14181B" stroke="#6F8F7B" stroke-width="2" />
    <text x="90" y="184" text-anchor="middle" font-size="9" fill="#F4F1EA" font-family="monospace">P1</text>

    <!-- Interconnecting SCADA Pipes with Animated Pulse -->
    <path d="M 80 180 L 142 180" stroke="#6F8F7B" stroke-width="3" class="signal-line" />
    <path d="M 178 180 L 265 120" stroke="#6F8F7B" stroke-width="2.5" class="signal-line" />
    <path d="M 160 198 L 220 280" stroke="#A8403A" stroke-width="2" stroke-dasharray="4 4" />

    <!-- Tank T2 (Eastside) -->
    <rect x="220" y="250" width="70" height="70" rx="8" fill="#1D2327" stroke="#4F7A5A" stroke-width="2" />
    <text x="255" y="285" text-anchor="middle" class="mono-telemetry" fill="#F4F1EA">TANK T2</text>
    <text x="255" y="300" text-anchor="middle" class="mono-telemetry" fill="#4F7A5A">4.5m</text>

    <!-- Pulsing Radar / Beacons -->
    <circle cx="160" cy="180" class="beacon-alert" fill="#C79A3B" />
    <circle cx="265" cy="75" class="beacon-1" fill="#6F8F7B" />
    <circle cx="255" cy="285" class="beacon-2" fill="#4F7A5A" />
  </g>

  <!-- Title & Typography Block (Left Side) -->
  <g transform="translate(60, 85)">
    <!-- Safety Category Badge -->
    <rect x="0" y="0" width="370" height="28" rx="6" fill="#A8403A" fill-opacity="0.18" stroke="#A8403A" stroke-width="1.2" />
    <circle cx="14" cy="14" r="5" fill="#A8403A" class="beacon-alert" />
    <text x="28" y="19" class="tagline" fill="#D97A73">SANDBOX ADVISORY • ZERO CONTROL ACTUATION</text>

    <!-- Main Headings -->
    <text x="0" y="78" class="title">PROJECT LASTLINE</text>
    <text x="0" y="112" class="subtitle">AI-Driven Cyber-Resilience for Critical Water Infrastructure</text>

    <!-- Feature Badges -->
    <g transform="translate(0, 150)">
      <!-- Badge 1: Bayesian WLS -->
      <rect x="0" y="0" width="165" height="34" rx="6" fill="#1D2327" stroke="#4F7A5A" stroke-width="1.2" />
      <text x="14" y="22" class="mono-telemetry" fill="#F4F1EA">⚡ 97.8% RMSE Reduction</text>

      <!-- Badge 2: EPANET Digital Twin -->
      <rect x="175" y="0" width="165" height="34" rx="6" fill="#1D2327" stroke="#4F7A5A" stroke-width="1.2" />
      <text x="189" y="22" class="mono-telemetry" fill="#F4F1EA">🌊 EPANET Digital Twin</text>

      <!-- Badge 3: 6 Autonomous Agents -->
      <rect x="350" y="0" width="165" height="34" rx="6" fill="#1D2327" stroke="#6F8F7B" stroke-width="1.2" />
      <text x="364" y="22" class="mono-telemetry" fill="#F4F1EA">🤖 6 Advisory Agents</text>
    </g>

    <!-- Diurnal Pipeline Metrics -->
    <g transform="translate(0, 215)">
      <text x="0" y="0" class="mono-telemetry">Telemetry Trust Engine: <tspan fill="#6F8F7B" font-weight="bold">ACTIVE</tspan> | Verification Gating: <tspan fill="#6F8F7B" font-weight="bold">100% P ≥ 15m</tspan> | Latency: <tspan fill="#6F8F7B" font-weight="bold">p95 &lt; 20ms</tspan></text>
    </g>
  </g>
</svg>
