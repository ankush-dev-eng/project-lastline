name: CI

on:
  push:
    branches: ["main", "phase/**"]
  pull_request:
    branches: ["main"]

jobs:
  backend-test:
    name: Backend Lint, Test & Safety Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff Linting
        run: |
          ruff check .

      - name: Run Ruff Formatting Check
        run: |
          ruff format --check .

      - name: Run Pytest & Safety Audit
        run: |
          pytest --cov=backend --cov=twin --cov=data --cov-report=term-missing --cov-fail-under=80 -v
